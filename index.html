<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro Perform Part 1</title>
  <meta name="description" content="Micro Perform Part 1">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171412'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23f4f1ea'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/instrument-serif-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/instrument-serif-400-italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "Instrument Sans";
      src: url("fonts/instrument-sans-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Instrument Sans";
      src: url("fonts/instrument-sans-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --paper: #f4f1ea;
      --ink: #171412;
      --quiet: #514c46;
      --line: rgba(23, 20, 18, 0.16);
      --serif: "Instrument Serif", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      --sans: "Instrument Sans", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      min-height: 100dvh;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    p {
      margin: 0;
    }

    ::selection {
      background: var(--ink);
      color: var(--paper);
    }

    .page {
      min-height: 100dvh;
      padding: clamp(14px, 2vw, 28px);
    }

    .sheet {
      min-height: calc(100dvh - clamp(28px, 4vw, 56px));
      border: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 3.2vw, 44px) clamp(20px, 4vw, 56px);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--quiet);
    }

    header.bar {
      padding-bottom: 1.15rem;
      border-bottom: 1px solid var(--line);
    }

    footer.bar {
      padding-top: 1.15rem;
      border-top: 1px solid var(--line);
    }

    main {
      display: grid;
      align-content: center;
      padding: clamp(2rem, 6vh, 4.5rem) 0;
    }

    h1 {
      margin: 0;
      max-width: 8ch;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(4.6rem, 12.4vw, 10.5rem);
      line-height: 0.84;
      letter-spacing: -0.035em;
    }

    h1 span,
    h1 em {
      display: block;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    @media (max-width: 640px) {
      .bar {
        font-size: 0.65rem;
        letter-spacing: 0.16em;
      }

      h1 {
        font-size: clamp(3.7rem, 20vw, 5.4rem);
      }
    }

    @media print {
      .page {
        padding: 0;
      }

      .sheet {
        min-height: 100vh;
        border-color: #cfcabe;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <article class="sheet">
      <header class="bar">
        <p>Art 106</p>
        <p>01</p>
      </header>
      <main>
        <h1>
          <span>Micro</span>
          <span>Perform</span>
          <em>Part 1</em>
        </h1>
      </main>
      <footer class="bar">
        <p>Micro Perform Part 1</p>
      </footer>
    </article>
  </div>
</body>
</html>
